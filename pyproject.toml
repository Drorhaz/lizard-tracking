[project]
name = "lizard-tracking"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "ultralytics>=8.3.0",
  "torch>=2.1.0",
  "torchvision>=0.16.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=15.0",
  "opencv-python>=4.9.0.80",
  "python-dotenv>=1.0.1",
  "typer>=0.12.3",
]

[project.scripts]
lizard-tracking = "lizard_tracking.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
