# Canonical configuration for pogona head pose training and deployment.
training:
  data_yaml: data/pogona_head_pose.yaml
  model: yolo11s-pose.pt
  project: runs/pose
  run_name: pogona_head_pose
  epochs: 150
  imgsz: 640
  batch: 16
  device: 0
  lr0: 0.01
  weight_decay: 0.0005
inference:
  weights: runs/pose/pogona_head_pose/weights/best.pt
  imgsz: 640
  conf: 0.25
tracking:
  source: videos/exp1.mp4
  overlay_video: true
  output_root: output
  overlay_filename: trajectory_overlay.mp4
  csv_filename: trajectory.csv
  parquet_filename: trajectory.parquet
